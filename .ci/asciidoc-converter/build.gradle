plugins {
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'org.asciidoctor.jvm.pdf' version '4.0.5'
}

apply plugin: 'java'
//version = 'PCIM - Revision 2.0 - Public Comment'

repositories {
    mavenCentral()
}

asciidoctor {
  sourceDir file('../../asciidoc')
  baseDirFollowsSourceDir()
  sources {
    include 'IHE_DEV_Suppl_PCIM.adoc'
    include 'cp-dev-*.adoc'
    include 'index.adoc'
    include 'pcim_named_requirements_plan.adoc'
    include 'pcim_oid_wg_review.adoc'

  }
  resources {
    from(sourceDir) {
        include '*.png'
        include 'images/**'
        include 'resources/**'
    }
  }
  outputDir = '../../output'
  outputOptions {
    backends = ['html', 'pdf']
  }
  asciidoctorj {
    modules {
       diagram.use() 
       diagram.version '1.5.16' 
    }
}
}

tasks.register('pcimRequirementsJson', Exec) {
  group = 'documentation'
  description = 'Extract PCIM semantic requirement blocks to JSON.'
  workingDir file('../..')
  commandLine 'python3',
      '.ci/asciidoc-converter/scripts/extract_pcim_requirements.py',
      '--source', 'asciidoc/IHE_DEV_Suppl_PCIM.adoc',
      '--output', 'output/referenced-artifacts/pcim-requirements.json',
      '--trace-output', 'output/referenced-artifacts/pcim-requirement-trace.json',
      '--oid-output', 'output/referenced-artifacts/pcim-oid-registry.json',
      '--oid-attributes-output', 'output/referenced-artifacts/pcim-oid-attributes.adoc',
      '--oid-table-output', 'output/referenced-artifacts/pcim-requirement-oids.adoc'

  inputs.file file('../../asciidoc/IHE_DEV_Suppl_PCIM.adoc')
  inputs.file file('scripts/extract_pcim_requirements.py')
  outputs.file file('../../output/referenced-artifacts/pcim-requirements.json')
  outputs.file file('../../output/referenced-artifacts/pcim-requirement-trace.json')
  outputs.file file('../../output/referenced-artifacts/pcim-oid-registry.json')
  outputs.file file('../../output/referenced-artifacts/pcim-oid-attributes.adoc')
  outputs.file file('../../output/referenced-artifacts/pcim-requirement-oids.adoc')
  // Provenance includes HEAD; regenerate rather than reuse a stale commit value.
  outputs.upToDateWhen { false }
}

tasks.register('pcimRequirementsCheck', Exec) {
  group = 'verification'
  description = 'Validate PCIM semantic requirement identifiers and required metadata.'
  workingDir file('../..')
  commandLine 'python3',
      '.ci/asciidoc-converter/scripts/extract_pcim_requirements.py',
      '--source', 'asciidoc/IHE_DEV_Suppl_PCIM.adoc',
      '--check-only'

  inputs.file file('../../asciidoc/IHE_DEV_Suppl_PCIM.adoc')
  inputs.file file('scripts/extract_pcim_requirements.py')
}

tasks.register('pcimRequirementsFixture', Exec) {
  group = 'documentation'
  description = 'Generate a stable review fixture for PCIM requirements JSON.'
  workingDir file('../..')
  commandLine 'python3',
      '.ci/asciidoc-converter/scripts/extract_pcim_requirements.py',
      '--source', 'asciidoc/IHE_DEV_Suppl_PCIM.adoc',
      '--output', '.ci/asciidoc-converter/fixtures/pcim-requirements.fixture.json',
      '--omit-commit'

  inputs.file file('../../asciidoc/IHE_DEV_Suppl_PCIM.adoc')
  inputs.file file('scripts/extract_pcim_requirements.py')
  outputs.file file('fixtures/pcim-requirements.fixture.json')
}

tasks.register('pcimOidTests', Exec) {
  group = 'verification'
  workingDir file('../..')
  commandLine 'python3', '-m', 'unittest', 'discover',
      '-s', '.ci/asciidoc-converter/scripts', '-p', 'test_pcim_oids.py'
}

['pcimRequirementsJson', 'pcimRequirementsCheck', 'pcimRequirementsFixture'].each { taskName ->
  tasks.named(taskName) {
    inputs.file file('scripts/pcim_oids.py')
    inputs.file file('../../asciidoc/pcim_oid_entities.adoc')
  }
}

// The appendix and inline labels must exist before document conversion.
asciidoctor.dependsOn tasks.named('pcimRequirementsJson'), tasks.named('pcimOidTests')
check.dependsOn tasks.named('pcimRequirementsCheck')
check.dependsOn tasks.named('pcimOidTests')
